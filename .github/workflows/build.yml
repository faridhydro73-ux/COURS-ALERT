name: Construire l'APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ranger les fichiers
        run: |
          set -e
          mkdir -p app/src/main/java/dz/alertecourses app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          mv *.java app/src/main/java/dz/alertecourses/
          mv AndroidManifest.xml app/src/main/
          mv accessibility_config.xml app/src/main/res/xml/
          mv strings.xml app/src/main/res/values/
          mv ic_launcher.xml ic_notif.xml app/src/main/res/drawable/
          printf '%s\n' "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" "rootProject.name = 'AlerteCourses'" "include ':app'" > settings.gradle
          printf '%s\n' "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          printf '%s\n' "plugins { id 'com.android.application' }" "android {" "  namespace 'dz.alertecourses'" "  compileSdk 34" "  defaultConfig { applicationId 'dz.alertecourses'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }" "  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }" "}" > app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compiler
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AlerteCourses-apk
          path: app/build/outputs/apk/debug/app-debug.apk
