plugins {
    id 'com.android.application'
}

android {
    namespace 'dz.alertecourses'
    compileSdk 34

    defaultConfig {
        applicationId "dz.alertecourses"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
